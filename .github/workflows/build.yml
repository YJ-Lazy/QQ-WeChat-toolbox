name: Android Build & v2.0 Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY || secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
      KEY_ALIAS_VALUE: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD_VALUE: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing keystore base64 secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing keystore password secret"; exit 1; }
          test -n "$KEY_ALIAS_VALUE" || { echo "Missing key alias secret"; exit 1; }
          test -n "$KEY_PASSWORD_VALUE" || { echo "Missing key password secret"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ace-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ace-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS_VALUE" >/dev/null

      - name: Build signed v2.0 release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/ace-release.jks
          RELEASE_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.KEY_ALIAS_VALUE }}
          RELEASE_KEY_PASSWORD: ${{ env.KEY_PASSWORD_VALUE }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" ACE-QQ-WeChat-Toolbox-v2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ACE-Toolkit-v2.0-release
          path: ACE-QQ-WeChat-Toolbox-v2.0.apk

      - name: Publish or refresh GitHub Release v2.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2.0 "$GITHUB_SHA"
          git push origin refs/tags/v2.0 --force

          NOTES="QQ/WeChat Toolbox 2.0 正式版本。包含 QQ/微信设置入口、清理工具、QQ SSAID 与 JavaScript 工具。此 APK 为 GitHub Actions 使用项目正式签名构建，并经过 apksigner 验证。"

          if gh release view v2.0 >/dev/null 2>&1; then
            gh release edit v2.0 --title "QQ/WeChat Toolbox v2.0" --notes "$NOTES"
            gh release delete-asset v2.0 ACE-QQ-WeChat-Toolbox-v2.0-debug.apk -y 2>/dev/null || true
            gh release upload v2.0 ACE-QQ-WeChat-Toolbox-v2.0.apk --clobber
          else
            gh release create v2.0 ACE-QQ-WeChat-Toolbox-v2.0.apk \
              --target "$GITHUB_SHA" \
              --title "QQ/WeChat Toolbox v2.0" \
              --notes "$NOTES"
          fi
